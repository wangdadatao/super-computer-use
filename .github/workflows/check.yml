name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: docs / format / build / tests / smoke
    # 必须用 macOS：SCUNative 依赖 ApplicationServices、ScreenCaptureKit 与 AppKit。
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # GitHub 托管的 runner 无法给辅助功能授权，真实夹具测试在这里跳过；
      # live 套件由维护者在已授权的机器上单独跑（见 docs/operations/testing.md）。
      SCU_SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # 与本地一致，只跑 scripts/check.sh 一个入口；缺少 swift-format 时补装。
      - name: Ensure swift-format
        run: |
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            brew install swift-format
          fi

      - name: Check
        run: scripts/check.sh
